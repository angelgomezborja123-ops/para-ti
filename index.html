<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Galaxia</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Jost:wght@300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: #f4ecff;
            font-family: 'Jost', system-ui, sans-serif;
            font-weight: 300;
            background: radial-gradient(ellipse at 50% 46%, #1b1036 0%, #0a0618 52%, #03020a 100%)
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: manipulation
        }

        canvas:focus-visible {
            outline: 1px dashed rgba(255, 255, 255, .35);
            outline-offset: -8px
        }

        #title {
            position: fixed;
            top: calc(22px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            text-align: center;
            font: italic 400 1.15rem 'Cormorant Garamond', Georgia, serif;
            letter-spacing: .06em;
            opacity: 0;
            animation: t 5s 1.6s ease forwards;
            pointer-events: none;
            color: #e9d8ff
        }

        @keyframes t {
            0% {
                opacity: 0;
                letter-spacing: .3em
            }

            30% {
                opacity: .85
            }

            100% {
                opacity: .4;
                letter-spacing: .06em
            }
        }

        #box {
            position: fixed;
            left: 50%;
            bottom: calc(7% + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: min(88vw, 660px);
            text-align: center;
            pointer-events: none
        }

        #ph {
            font: italic 400 clamp(1.45rem, 4.6vw, 2.2rem)/1.35 'Cormorant Garamond', Georgia, serif;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(10px);
            transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s ease;
            text-shadow: 0 0 24px var(--g, #b99cff)
        }

        #ph.on {
            opacity: 1;
            filter: blur(0);
            transform: none
        }

        #nm {
            margin-top: .7rem;
            font-size: .85rem;
            letter-spacing: .14em;
            opacity: 0;
            transition: opacity 1.4s ease .3s;
            color: #cdb8f5
        }

        #nm.on {
            opacity: .75
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(7% + env(safe-area-inset-bottom, 0px));
            text-align: center;
            font-size: .95rem;
            letter-spacing: .12em;
            color: #cdb8f5;
            opacity: 0;
            animation: h 3s 4s ease forwards;
            transition: opacity .8s;
            pointer-events: none
        }

        @keyframes h {
            to {
                opacity: .7
            }
        }

        #hint.off {
            animation: none;
            opacity: 0
        }

        #flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 5
        }

        #qrc {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top, 0px));
            right: 14px;
            width: 72px;
            height: 72px;
            border-radius: 10px;
            background: #fff;
            opacity: 0;
            z-index: 6;
            cursor: pointer;
            transform-origin: top right;
            transition: transform .55s cubic-bezier(.2, .8, .2, 1), opacity 1.2s ease, box-shadow .5s;
            box-shadow: 0 0 18px rgba(160, 110, 255, .5)
        }

        #qrc.on {
            opacity: .85
        }

        #qrc.on:hover {
            opacity: 1
        }

        #qrc.big {
            transform: scale(3.3);
            opacity: 1;
            box-shadow: 0 0 40px rgba(160, 110, 255, .7)
        }

        @media (max-width:600px) {
            #qrc {
                width: 56px;
                height: 56px;
                right: 10px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            #title {
                animation: none;
                opacity: .5
            }
        }
    </style>
</head>

<body>
    <canvas id="c" tabindex="0"
        aria-label="Galaxia interactiva. Toca una estrella o pulsa Enter para leer una frase."></canvas>
    <div id="title">una galaxia para mirar despacio</div>
    <div id="hint">toca una estrella · o el centro, para viajar</div>
    <div id="flash"></div>
    <img id="qrc" alt="Código QR: toca para agrandarlo" width="72" height="72">
    <div id="box">
        <div id="ph"></div>
        <div id="nm"></div>
    </div>
    <script>
        const $ = id => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d'), ph = $('ph'), nm = $('nm'), hint = $('hint');
        const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const rnd = (a, b) => a + Math.random() * (b - a), gau = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5, TAU = 6.2832;
        let TILT = .46, ROT = -.38, cR = Math.cos(ROT), sR = Math.sin(ROT);
        let W, H, R, cx, cy, mx = 0, my = 0, tx = 0, ty = 0, PX = 0, PY = 0, sc = 1, spin = 0;
        function size() { const D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; ctx.setTransform(D, 0, 0, D, 0, 0); R = Math.min(W * .5, H * .62) * .92; cx = W / 2; cy = H * .45 }
        addEventListener('resize', size); size();
        function P(r, th) { const x = r * Math.cos(th) * sc, y = r * Math.sin(th) * TILT * sc; return [cx + PX + x * cR - y * sR, cy + PY + x * sR + y * cR] }

        /* ---- estrellas con frase ---- */
        const DATA0 = [
            ["Aurora", "Incluso la oscuridad más inmensa se deja atravesar por una pequeña luz."],
            ["Lumen", "Eres polvo de estrellas que aprendió a soñar."],
            ["Celeste", "No hay distancia que el recuerdo no pueda cruzar."],
            ["Ámbar", "Brilla sin pedir permiso: el cielo ya te estaba esperando."],
            ["Selene", "Cada noche, el universo te recuerda que apenas comienza."],
            ["Éter", "Lo que amas viaja contigo, aunque esté a años luz."],
            ["Brisa", "La calma también es una forma de resplandecer."],
            ["Nácar", "Hay estrellas que ya no existen y aun así nos guían."],
            ["Alba", "Que tus sueños sean tan grandes como el silencio entre dos galaxias."],
            ["Zafiro", "Nada florece con prisa; las estrellas tardan millones de años."],
            ["Ónix", "Mira hacia arriba: el infinito te está sonriendo."],
            ["Vela", "Somos pequeños, y por eso cabe tanto asombro."],
            ["Rocío", "Donde termina el miedo, empieza el firmamento."],
            ["Ensueño", "Una luz lejana también es una promesa."],
            ["Marea", "El tiempo es un río; las estrellas, sus lámparas."],
            ["Cobre", "Pide un deseo: el cosmos escucha en voz baja."],
            ["Bruma", "Tu historia está escrita en la misma luz que cruza el cielo."],
            ["Azur", "Hasta el vacío guarda un poco de música."],
            ["Oriente", "Quien sabe esperar, aprende a brillar."],
            ["Lira", "Todo comienzo fue alguna vez una chispa."],
            ["Estela", "Caer también es una forma de iluminar."],
            ["Faro", "En algún lugar del cielo, alguien piensa en ti."],
            ["Añil", "Sé órbita para quien te necesita y rumbo para ti mismo."],
            ["Hálito", "La belleza no hace ruido: simplemente aparece."],
            ["Ópalo", "Cada latido tuyo es un pequeño big bang."],
            ["Nocturna", "Que la noche te sea leve y el amanecer, infinito."]];
        const DATA1 = [
            ['Ítaca', 'Viajar no es llegar lejos: es volver distinto.'],
            ['Umbral', 'Cada puerta que cruzas deja una versión tuya atrás.'],
            ['Prisma', 'Hay mundos enteros escondidos detrás de un parpadeo.'],
            ['Eco', 'Lo que crees imposible solo no ha encontrado su dimensión.'],
            ['Corriente', 'Deja que la luz te lleve: ella conoce el camino.'],
            ['Cristal', 'Aquí el silencio tiene color y los sueños tienen peso.'],
            ['Auroria', 'Otro cielo, la misma esperanza.'],
            ['Rumbo', 'No temas al salto: también las estrellas nacieron de uno.'],
            ['Lumbre', 'Lo bello suele esperar al otro lado de la valentía.'],
            ['Fénix', 'Todo lo que arde puede volverse constelación.'],
            ['Sirena', 'El universo es un abrazo que aún no terminamos de entender.'],
            ['Vértigo', 'Si el vértigo te encuentra, ábrele los brazos: es el principio del vuelo.'],
            ['Espejo', 'Cada galaxia es un pensamiento del infinito.'],
            ['Regreso', 'Siempre puedes volver al centro: ahí empieza cualquier viaje.']];
        const PL0 = [{ o: .16, s: .9, r: 4, c: ['#ffe0a8', '#c9772f'] }, { o: .27, s: .55, r: 8, c: ['#a8e8ff', '#2c6fb3'], moon: 1 }, { o: .4, s: .38, r: 12, c: ['#ffd0b8', '#b54f3a'], ring: 1 }, { o: .55, s: .26, r: 7, c: ['#b9fff0', '#2f9c93'] }, { o: .72, s: .17, r: 10, c: ['#d9c4ff', '#6a45c4'], ring: 1 }];
        const PL1 = [{ o: .15, s: .8, r: 5, c: ['#fff1a8', '#d9a21e'] }, { o: .25, s: .5, r: 9, c: ['#a6ffd8', '#1f9e7a'], moon: 1 }, { o: .37, s: .36, r: 13, c: ['#ffb8f0', '#b02f9c'], ring: 1 }, { o: .5, s: .28, r: 7, c: ['#b8f2ff', '#2a86c9'] }, { o: .62, s: .2, r: 11, c: ['#fff0c8', '#c97a2a'], ring: 1, moon: 1 }, { o: .78, s: .14, r: 8, c: ['#e0c8ff', '#7a4fd0'] }];
        const DIMS = [
            { name: 'Dimensión I · Origen', data: DATA0, arms: 3, wind: 4.2, tilt: .46, rot: -.38, hues: [210, 282, 338, 40, 175, 18], bh: [270, 325, 200, 35], n: 2300, nm: 1400, col: q => q < .2 ? 38 : q < .5 ? 330 - q * 60 : q < .8 ? 270 - (q - .5) * 80 : 205, core: ['255,240,215', '255,200,150', '230,120,160', '120,70,220'], bg: 'radial-gradient(ellipse at 50% 46%,#1b1036 0%,#0a0618 52%,#03020a 100%)', pl: PL0 },
            { name: 'Dimensión II · Aurora', data: DATA1, arms: 5, wind: 3.1, tilt: .4, rot: .3, hues: [160, 300, 45, 190, 330, 120], bh: [160, 300, 190, 45, 330], n: 3300, nm: 1900, col: q => q < .2 ? 48 : q < .5 ? 150 + q * 60 : q < .8 ? 185 + (q - .5) * 80 : 305, core: ['255,252,230', '255,226,150', '80,230,180', '150,60,230'], bg: 'radial-gradient(ellipse at 50% 46%,#123049 0%,#0a1428 50%,#02050b 100%)', pl: PL1 }];
        let D = DIMS[0], di = 0, S, gal, PL, BH;
        function build(i) {
            di = i; D = DIMS[i]; TILT = D.tilt; ROT = D.rot; cR = Math.cos(ROT); sR = Math.sin(ROT); BH = D.bh;
            S = D.data.map(([n, t], k) => { const r = (.16 + .84 * ((k * .618) % 1)) * R * .98; return { n, t, r, th: (k % D.arms) * TAU / D.arms + r / R * D.wind + rnd(-.2, .2), h: D.hues[k % 6], z: rnd(2.4, 3.9), p: rnd(0, TAU), hv: 0, x: 0, y: 0 } });
            const N = innerWidth < 700 ? D.nm : D.n; gal = [];
            for (let k = 0; k < N; k++) {
                let r, th;
                if (Math.random() < .2) { r = Math.pow(Math.random(), 2) * R * .3; th = rnd(0, TAU) }
                else { const u = Math.pow(Math.random(), 1.5); r = R * (.03 + u * .97); th = (k % D.arms) * TAU / D.arms + r / R * D.wind + gau() * (.2 + .45 * u) }
                const q = r / R; gal.push({ r, th, s: Math.random() < .08 ? 2 : 1, a: rnd(.35, 1), f: rnd(1, 3), p: rnd(0, TAU), c: `hsl(${D.col(q)},85%,${72 - q * 14}%)` })
            }

        }
        build(0);
        const ws = []; for (let i = 0; i < 260; i++)ws.push({ r: Math.random(), an: rnd(0, TAU), v: rnd(.4, 1.2), a: rnd(.4, 1), o: rnd(-30, 30) });

        /* ---- polvo estelar de la galaxia ---- */

        const bg = []; for (let i = 0; i < 240; i++)bg.push({ x: Math.random(), y: Math.random(), z: rnd(.2, 1), s: Math.random() < .1 ? 2 : 1, a: rnd(.3, 1), f: rnd(.8, 2.6), p: rnd(0, TAU), c: Math.random() < .2 ? '#cfe0ff' : Math.random() < .2 ? '#ffe3c7' : '#fff' });


        /* ---- planetas ---- */

        function planet(p, x, y) {
            const k = Math.max(.6, Math.min(1.3, R / 420)), pr = p.r * k;
            let g = ctx.createRadialGradient(x, y, 0, x, y, pr * 2.4); g.addColorStop(0, p.c[1] + '55'); g.addColorStop(1, p.c[1] + '00'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, pr * 2.4, 0, TAU); ctx.fill();
            if (p.ring) { ctx.strokeStyle = 'rgba(255,236,210,.55)'; ctx.lineWidth = Math.max(1, pr * .18); ctx.beginPath(); ctx.ellipse(x, y, pr * 2.1, pr * .6, ROT, Math.PI, TAU); ctx.stroke() }
            g = ctx.createRadialGradient(x - pr * .4, y - pr * .4, pr * .1, x, y, pr); g.addColorStop(0, p.c[0]); g.addColorStop(.55, p.c[1]); g.addColorStop(1, '#0b0616');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, pr, 0, TAU); ctx.fill();
            if (p.ring) { ctx.strokeStyle = 'rgba(255,236,210,.7)'; ctx.beginPath(); ctx.ellipse(x, y, pr * 2.1, pr * .6, ROT, 0, Math.PI); ctx.stroke() }
            if (p.moon) { const a = T * 2.4, mx2 = x + Math.cos(a) * pr * 2.1, my2 = y + Math.sin(a) * pr * .8; ctx.fillStyle = '#e9e4f5'; ctx.beginPath(); ctx.arc(mx2, my2, pr * .26, 0, TAU); ctx.fill() }
        }

        /* ---- cuerpos en movimiento ---- */
        const comets = [], meteors = [], shoots = [], sparks = [], rip = [];
        function spawnComet() { const l = Math.random() < .5, a = rnd(.2, .5), sp = rnd(70, 105); comets.push({ x: l ? -90 : W + 90, y: rnd(0, H * .5), vx: (l ? 1 : -1) * sp * Math.cos(a), vy: sp * Math.sin(a) }) }
        function spawnMeteor() { const a = rnd(.9, 1.35), d = Math.random() < .5 ? 1 : -1, sp = rnd(480, 700); meteors.push({ x: rnd(W * .1, W * .9), y: -20, vx: d * sp * Math.cos(a), vy: sp * Math.sin(a), l: 0, m: rnd(.9, 1.4), b: 0 }) }
        function spawnShoot() { const d = Math.random() < .5 ? 1 : -1, a = rnd(.2, .55), sp = rnd(1000, 1500); shoots.push({ x: rnd(0, W), y: rnd(0, H * .55), vx: d * sp * Math.cos(a), vy: sp * Math.sin(a), l: 0, m: rnd(.45, .8) }) }
        function burst(x, y, col, n, v, g) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(.2, 1) * v; sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 0, m: rnd(.6, 1.4), c: col, g }) } }

        /* ---- interacción ---- */
        let sel = null, hov = null, shown = false, selT = 0, selA = 0, tintA = 0, hideT, showT, idx = -1, hc = false, warp = null, I0 = 0;
        const onCore = (x, y) => { const [a, b] = P(0, 0); return Math.hypot(x - a, y - b) < Math.max(30, R * .09) };
        function go() { if (warp) return; warp = { t: 0 }; hint.classList.add('off'); clearTimeout(hideT); clearTimeout(showT); ph.classList.remove('on'); nm.classList.remove('on'); shown = false }
        function swap() {
            build((di + 1) % DIMS.length); I0 = T; sel = null; hov = null; shown = false; selA = 0; tintA = 0; idx = -1; rip.length = 0;
            const t = $('title'); t.textContent = D.name; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = 't 5s .8s ease forwards'
        }
        function pick(x, y) { let b = null, bd = 1e9; for (const s of S) { const d = Math.hypot(s.x - x, s.y - y); if (d < Math.max(24, s.z * 7) && d < bd) { bd = d; b = s } } return b }
        function choose(s) {
            sel = s; selT = 0; shown = true; tintA *= .3; hint.classList.add('off');
            clearTimeout(hideT); clearTimeout(showT); ph.classList.remove('on'); nm.classList.remove('on');
            showT = setTimeout(() => { ph.textContent = s.t; nm.textContent = 'estrella ' + s.n; ph.style.setProperty('--g', `hsl(${s.h},90%,68%)`); ph.classList.add('on'); nm.classList.add('on') }, 420);
            hideT = setTimeout(() => { ph.classList.remove('on'); nm.classList.remove('on'); shown = false }, 12000);
            rip.push({ x: s.x, y: s.y, t: 0, h: s.h }); burst(s.x, s.y, `hsl(${s.h},100%,80%)`, 30, 120, 0); idx = S.indexOf(s)
        }
        cv.addEventListener('pointermove', e => { tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; hov = warp ? null : pick(e.clientX, e.clientY); hc = !warp && !hov && onCore(e.clientX, e.clientY); cv.style.cursor = hov || hc ? 'pointer' : 'default' });
        cv.addEventListener('pointerdown', e => { if (warp) return; const s = pick(e.clientX, e.clientY); if (s) choose(s); else if (onCore(e.clientX, e.clientY)) go(); else { rip.push({ x: e.clientX, y: e.clientY, t: 0, h: 260, soft: 1 }) } });
        cv.addEventListener('keydown', e => { if (['Enter', ' ', 'ArrowRight'].includes(e.key)) { e.preventDefault(); choose(S[(idx + 1) % S.length]) } else if (e.key === 'ArrowLeft') { e.preventDefault(); choose(S[(idx - 1 + S.length) % S.length]) } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); go() } });

        /* ---- dibujo de estrella ---- */
        function star(s) {
            const [x, y] = P(s.r, s.th + spin); s.x = x; s.y = y; s.hv += ((s === hov ? 1 : 0) - s.hv) * .12;
            const k = .8 + .2 * Math.sin(T * 2 + s.p), z = s.z * (1 + .55 * s.hv) * (s === sel && shown ? 1.25 : 1), R7 = z * 7;
            const g = ctx.createRadialGradient(x, y, 0, x, y, R7); g.addColorStop(0, `hsla(${s.h},100%,85%,${.9 * k})`); g.addColorStop(.25, `hsla(${s.h},100%,65%,${.28 * k})`); g.addColorStop(1, `hsla(${s.h},100%,60%,0)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R7, 0, TAU); ctx.fill();
            const L = z * (3.5 + 3 * s.hv); ctx.strokeStyle = `hsla(${s.h},100%,92%,${.75 * k})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, z * .45, 0, TAU); ctx.fill()
        }

        /* ---- bucle ---- */
        let T = 0, last = performance.now(), nC = 4, nM = 2.5, nS = 1;
        function frame(now) {
            const dt = Math.min((now - last) / 1000, .05); last = now; T += dt * (RM ? .25 : 1);
            if (warp) { warp.t += dt / 3.6; if (warp.t >= .5 && !warp.done) { warp.done = 1; swap() } if (warp.t >= 1) { warp = null; $('flash').style.opacity = 0 } }
            const w = warp ? warp.t : 0, e = Math.min((T - I0) / 3.4, 1), ease0 = warp && w < .5 ? 1 : 1 - Math.pow(1 - e, 3), zoom = warp && w < .5 ? 1 + 9 * Math.pow(w / .5, 3) : 1, fade = warp && w < .5 ? 1 - Math.pow(w / .5, 2) : 1, tw = warp ? (w < .5 ? Math.pow(w / .5, 2) : Math.pow(1 - (w - .5) / .5, 2)) * 2.5 : 0, ease = ease0 * fade;
            sc = (.55 + .45 * ease0) * zoom; spin = T * .04 + (1 - ease0) * 2.2 + tw;
            mx += (tx - mx) * .04; my += (ty - my) * .04; PX = mx * 16; PY = my * 10;
            ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
            for (const b of bg) { const k = .5 + .5 * Math.sin(T * b.f + b.p); ctx.globalAlpha = ease * (.2 + .7 * k) * b.a; ctx.fillStyle = b.c; ctx.fillRect(((b.x * W - mx * b.z * 22) % W + W) % W, ((b.y * H - my * b.z * 14) % H + H) % H, b.s, b.s) }
            for (let k = 0; k < 18; k++) {
                const r = R * (.18 + .8 * k / 18), [x, y] = P(r, (k % D.arms) * TAU / D.arms + r / R * D.wind + spin), rad = R * (.14 + .1 * (k % 4) / 3) * sc, h = BH[k % BH.length], g = ctx.createRadialGradient(x, y, 0, x, y, rad);
                g.addColorStop(0, `hsla(${h},80%,60%,.09)`); g.addColorStop(1, `hsla(${h},80%,60%,0)`); ctx.globalAlpha = ease; ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2)
            }
            for (const p of gal) { const [x, y] = P(p.r, p.th + spin); ctx.globalAlpha = ease * p.a * (.7 + .3 * Math.sin(T * p.f + p.p)); ctx.fillStyle = p.c; ctx.fillRect(x, y, p.s, p.s) }
