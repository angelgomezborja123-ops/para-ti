<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chistes malos costeños 🥥</title>
<style>
:root{--ink:#fff;--btn:#fff;--btnink:#173a40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0e7c86;overflow:hidden}
*{box-sizing:border-box}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.bg{position:fixed;inset:0;opacity:0;transition:opacity 1s ease}
.bg.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.28),transparent 45%),radial-gradient(circle at 85% 90%,rgba(0,0,0,.25),transparent 50%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 24px 120px;perspective:900px}
.card{position:absolute;max-width:760px;width:calc(100% - 48px);text-align:center;font-size:clamp(1.7rem,6.2vw,3.4rem);line-height:1.18;font-weight:700;text-shadow:0 3px 18px rgba(0,0,0,.3)}
.w{display:inline-block;opacity:0;margin:0 .13em;animation-duration:.8s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.9,.2,1);animation-delay:calc(var(--i)*60ms)}
.fx-rise .w{animation-name:rise}.fx-zoom .w{animation-name:zoom}.fx-flip .w{animation-name:flip}.fx-drop .w{animation-name:drop;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}.fx-spin .w{animation-name:spin}
@keyframes rise{from{opacity:0;transform:translateY(70px) rotate(5deg);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes zoom{from{opacity:0;transform:scale(3.2);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes flip{from{opacity:0;transform:rotateX(95deg) translateY(40px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-140px) scale(.7)}to{opacity:1;transform:none}}
@keyframes spin{from{opacity:0;transform:rotate(-220deg) scale(0)}to{opacity:1;transform:none}}
.card.out{animation:out .5s ease-in forwards;pointer-events:none}
@keyframes out{to{opacity:0;transform:scale(.85) translateY(-40px);filter:blur(12px)}}
#nav{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:18px}
button{font:inherit;border:0;cursor:pointer;border-radius:50%;background:var(--btn);color:var(--btnink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
button:active{transform:scale(.88)}button:hover{transform:scale(1.08)}
button:focus-visible{outline:4px solid #fff;outline-offset:4px}
#next{width:84px;height:84px;font-size:2.4rem;animation:pulse 2s infinite}
#prev{width:52px;height:52px;font-size:1.4rem;opacity:.85}
@keyframes pulse{0%{box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 0 rgba(255,255,255,.55)}70%,100%{box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 0 26px rgba(255,255,255,0)}}
#cnt{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;font:600 .95rem system-ui,sans-serif;opacity:.85}
.fly{position:fixed;left:0;top:0;font-size:28px;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.w{animation:none!important;opacity:1}.card.out{animation:none;opacity:0}#next{animation:none}}
</style>
</head>

<div id="cnt"></div>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Anterior">←</button><button id="next" aria-label="Siguiente">→</button></div>
<script>

pejo se rompió de la risa, ¡ay, mijo!", "¿Cuál es el colmo de un nadador? Que lo ahoguen con una olla de sancocho, ¡eche!", "¿Por qué el coco no se queja? Porque le han dado tantos machetazos que ya perdió la cuenta, ¡ave maría!", "Mi papá dice que todo tiempo pasado fue mejor. Claro, era el que pagaba él, ¡qué vaina!", "¿Qué le dijo el raspao a la tarde? «Con tanto calor hasta yo me derrito, ajá».", "¿Por qué los costeños nunca llegan a tiempo? Porque el reloj también se derrite con el calor, ¡mi llave!", "Le dije a un amigo: «Préstame mil». Respondió: «Prestado no hay, hermano, solo hay cuentos», ¡ay, Dios!", "¿Qué es lo peor de la dieta? Que la arepa no entiende de dietas ni de tu fuerza de voluntad, ¡no me diga!", "¿Cuál es el colmo de un loro? Que le digan «cállate» y conteste: «Cállate tú, ajá».", "Mi vecino puso una piscina. El calor la usó primero, ¡ajá!", "¿Qué hace un tiburón sin dientes? Rezarle a un cangrejo pa' que le preste las pinzas, ¡ay, mijo!", "¿Cuál es el único animal que se ríe de todos? La iguana: nos mira desde el árbol y se muere de risa, ¡eche!", "¿Por qué la cerveza es tan cara? Porque el calor la valora más que tu salario, ¡ave maría!", "Un costeño le dijo a Dios: «Dame paciencia». Dios respondió: «Primero deja de gritar, ajá».", "¿Qué es lo más inútil? Un paraguas en Santa Marta: de nada sirve cuando el sol te mata, ¡qué vaina!", "Mi abuelo contaba tantas mentiras que hasta el cangrejo le decía «no me diga», ¡mi llave!", "¿Qué le dijo el coco a la palma? «Si me caigo, que sea encima de un político», ¡ay, Dios!", "¿Cuál es el colmo de un mecánico? Que su moto lo deje a pie y le toque pedir un aventón, ¡no me diga!", "¿Por qué el burro es tan terco? Porque nunca le han ofrecido plata en vez de zanahoria, ¡ajá!", "Mi suegra me dijo que cambiara. Yo cambié: de casa, de ciudad y de número de teléfono, ¡ay, mijo!", "¿Qué es más difícil que encontrar parqueadero en Santa Marta en festivo? Encontrar plata el día 28, ¡eche!", "¿Qué le dijo la lluvia al costeño? «Hoy sí caigo», y no cayó, ¡ave maría!", "¿Qué es lo único que no se derrite en el Caribe? La mala leche del que se quedó sin ron, ¡qué vaina!", "¿Por qué la sirena se fue de Barranquilla? Porque en el Carnaval le tocó bailar con tantos pies izquierdos, ¡mi llave!", "Mi gato se volvió costeño: duerme todo el día y se queja del calor, ¡ay, Dios!", "¿Cuál es el colmo de un abogado costeño? Defender al cliente mientras se come una empanada, ¡no me diga!", "¿Qué le dijo una langosta a otra? «Si seguimos así, nos hierven la fama», ¡ajá!", "¿Por qué el pescado no se enamora? Porque siempre sale con el anzuelo mal puesto, ¡ay, mijo!", "Fui a una entrevista de trabajo. Me preguntaron: «¿Qué sabe hacer?». Dije: «Nada, pero con mucho entusiasmo», ¡eche!", "¿Qué es lo más caliente del mundo? Una moto parqueada al sol a las doce, ¡ave maría!", "¿Cuál es el colmo de un panadero costeño? Que se le queme el pan por echar cuentos, ¡qué vaina!", "¿Por qué el burro nunca olvida? Porque siempre lleva la carga de todo lo que le deben, ¡mi llave!", "Mi tío es tan tacaño que apaga la luz del sol cuando se acuesta, ¡ay, Dios!", "¿Qué le dijo la hamaca al viento? «Muévete con ganas, que hoy no hay que hacer nada», ¡no me diga!", "¿Por qué el cangrejo nunca llega a tiempo? Porque va de lado y se pierde por el camino, ¡ajá!", "Me dijeron que el amor es ciego. Yo lo vi con una arepa y le creí, ¡ay, mijo!", "¿Qué es lo único peor que un chiste malo? Uno costeño contado a las tres de la tarde con sol, ¡eche!", "¿Cuál es el colmo de la puntualidad? Que un costeño llegue a la hora y no haya nadie, ¡ave maría!", "Mi mamá me dio un consejo: «Mijo, no te metas en problemas». Y me metí en cuatro, ¡qué vaina!", "¿Qué le dijo el sol al costeño? «Hoy te cocino de ñapa», ¡mi llave!", "¿Qué hace un guardián de playa en Navidad? Cuidar que el calor no se robe el aguinaldo, ¡ay, Dios!", "¿Cuál es la diferencia entre un costeño y un reloj? Ninguna: los dos se atrasan y los dos se quejan del ti const S=["el coco","la arepa","el cangrejo","el burro","la hamaca","el pelícano","la iguana","el mototaxi","el sancocho","el patacón","la ola","el sol","el raspao","el chinchorro","el gallo","la nevera","el abanico","la yuca","el loro","el pescado","la palma","el mango","la langosta","el tiburón","el ventilador"];
const Q=["Aguántame que hoy ando de mal humor","Yo no me muevo de aquí, mijo","Con este calor ni pa' pensar sirvo","Ya casi, ya casi, y nunca llega","Préstame mil que mañana te pago","Aquí el único que trabaja soy yo","No me mires así, que me da pena","Hoy no fío, mañana tampoco","Yo solo vine por el chisme","Yo sí te quiero, pero de lejos","Qué calor tan descarado","Pa' mañana lo dejo, mi llave","Yo me quedo aquí guindado","Eso no era conmigo","Ahorita voy, ya mismo llego","Pídeme lo que quieras, menos plata","Yo aquí no vine a sufrir, vine a vacilar","Deja el drama, que la arepa se enfría","Me da flojera hasta quejarme","Mijo, yo no cobro, pero tampoco regalo"];
const C=["un pescador","un mototaxista","un panadero","un vigilante","un mesero","un barranquillero","un tendero","un cantante de vallenato","un salvavidas","un heladero","un albañil","un taxista","un profesor","un abogado","un cocinero","un músico","un peluquero","un doctor","un jardinero","un bombero"];
const D=["Que se le queme el almuerzo por echar cuentos","Quedarse dormido en pleno turno","Cobrar el fiado con una sonrisa y sin plata","Llegar temprano y encontrar todo cerrado","Perder el sombrero en un día sin viento","Que le digan «ya mismo» y esperar tres horas","Quedarse sin plata el día de la quincena","Que el calor le derrita hasta las excusas","Pedir un aventón y que le pase un burro","Ser puntual en un país de «ahorita»","Ahogarse en un vaso de agua con hielo","Tener nevera y no tener nada frío","Dormir con ventilador y despertar sudando","Echar un cuento y quedarse sin oyentes","Ganarse la lotería y perder el billete","Cantar bonito y que el vecino prenda el parlante","Pedir silencio en pleno Carnaval","Quedarse sin voz el día del chisme","Que le suba el pasaje y le baje el ánimo","Tener hamaca y no tener dónde colgarla"];
const P=["abuelo","tío","primo","vecino","suegro","hermano","compadre","cuñado","gallo","gato","perro","burro"];
const AJ=["flojo que se acuesta a descansar de tanto dormir","tacaño que le cobra al eco","despistado que se perdió en su propia casa","bravo que discute hasta con la brisa","cansón que hasta el loro le pide silencio","madrugador que se levanta a la hora del almuerzo","puntual que llega ayer","tacaño que fía hasta el sol","pobre que le debe plata a la sombra","chismoso que se entera de lo que no ha pasado","dormilón que ronca en el chinchorro y se oye en Ciénaga","bailarín que hasta el semáforo lo sigue en rojo","caliente que suda con el ventilador prendido","hablador que le cuenta chistes al espejo","terco que le gana una discusión al burro","elegante que va a la playa con corbata","viajero que se pierde yendo a la tienda","vago que cansa al que lo mira","goloso que se come la arepa antes de hacerla","cuentero que hasta el cangrejo le dice «no me diga»","enamorado que le escribe versos a la nevera","valiente que le pelea al calor","ahorrador que guarda hasta los estornudos","fiestero que celebra los lunes","trabajador que descansa de lunes a lunes","rezandero que le pide a Dios que baje el calor","humilde que presume de no tener nada","sabio que sabe de todo y no sirve pa' nada","ocupado que siempre está desocupado","paciente que espera la quincena desde el primero","viejo que ya no cree ni en el fiado"];

 }
}
